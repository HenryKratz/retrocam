<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Galeria privada</title>
<style>body{margin:0;background:#0b0b0c;color:#f2efe9;font:14px system-ui}#lg{padding:24px;display:flex;flex-direction:column;gap:10px;max-width:360px;margin:auto}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #2e2e32;background:#1a1a1c;color:inherit}button{background:#ff8a1f;color:#111;font-weight:700;border:0}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px}#gg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}#gg img,#gg video{width:100%;aspect-ratio:1;object-fit:cover}@media(min-width:700px){#gg{grid-template-columns:repeat(6,1fr)}}</style></head><body>
<div id="lg"><h2>Galeria privada</h2><input id="em" type="email" placeholder="E-mail"><input id="pw" type="password" placeholder="Senha"><button id="go">Entrar</button><p id="er"></p></div>
<div id="gl" hidden><div class="bar"><b id="n"></b><span><button id="ref">Atualizar</button> <button id="out">Sair</button></span></div><div id="gg"></div></div>
<script src="config.js"></script><script>
const $=s=>document.querySelector(s),S0=window.SB||{url:'',key:''};let tk=null;
async function api(p,o={}){const r=await fetch(S0.url+p,{...o,headers:{apikey:S0.key,...((tk||S0.key.startsWith('eyJ'))?{Authorization:'Bearer '+(tk||S0.key)}:{}),'Content-Type':'application/json'}});if(!r.ok)throw new Error(r.status);return r.json()}
$('#go').onclick=async()=>{try{const r=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});tk=r.access_token;load()}catch(e){$('#er').textContent='E-mail ou senha inválidos'}};
async function load(){$('#lg').hidden=true;$('#gl').hidden=false;
const L=await api('/storage/v1/object/list/photos',{method:'POST',body:JSON.stringify({prefix:'',limit:500,sortBy:{column:'created_at',order:'desc'}})}),f=L.filter(i=>i.id);
$('#n').textContent=f.length+' arquivos';if(!f.length){$('#gg').innerHTML='';return}
const S=await api('/storage/v1/object/sign/photos',{method:'POST',body:JSON.stringify({expiresIn:3600,paths:f.map(i=>i.name)})});
$('#gg').innerHTML=S.filter(s=>s.signedURL).map(s=>{const u=S0.url+'/storage/v1'+s.signedURL;return /\.(mp4|webm)$/.test(s.path)?`<video src="${u}" controls playsinline></video>`:`<a href="${u}" target="_blank"><img src="${u}" loading="lazy" alt=""></a>`}).join('')}
$('#ref').onclick=load;$('#out').onclick=()=>location.reload();
</script></body></html>
